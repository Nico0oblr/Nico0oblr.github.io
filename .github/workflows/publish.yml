name: Build and publish Quarto

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build.py'
      - '.github/workflows/publish.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/build.py'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quarto-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - name: Render and stage website
        run: python3 scripts/build.py
      - name: Update published pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Render Quarto website'
            git push
            # GITHUB_TOKEN pushes do not themselves trigger a Pages build.
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          fi
      - name: Keep rendered preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: site/_site/
